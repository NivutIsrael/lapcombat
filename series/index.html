      ? `<td class="tot" data-v="${r.total ?? ""}">${ft(r.total)}</td><td data-v="${r.behind ?? ""}">${r.behind ? `<span dir="ltr">+${ft(r.behind)}</span>` : r.place === 1 ? "" : "–"}</td>`
        + `<td data-v="${r.move ?? ""}">${r.move > 0 ? `<span class="up">▲${r.move}</span>` : r.move < 0 ? `<span class="down">▼${-r.move}</span>` : r.move === 0 ? "=" : ""}</td>`
      : `<td class="tot" data-v="${r.total}">${pts(r.total)}</td><td data-v="${r.ran}">${r.ran}</td>`) + `</tr>`).join("");
  $("standing").innerHTML = rows.length ? `<div class="scroll"><table class="cards"><thead>${head}</thead><tbody>${body}</tbody></table></div>`
    : `<p class="empty">אין תוצאות בקטגוריה הזו.</p>`;
  tableTools($("standing"), `series-${s.key}-${k}`);
  $("note").textContent = `לפי הדוחות של ${R.map(r => r.label).join(", ")}. נווט מזוהה לפי שמו, בכל קטגוריה בנפרד.`;
}
readHash(); render();
addEventListener("hashchange", () => { readHash(); render(); });
a11yInit($("a11yb")); themeInit($("theme"));
</script>
</body>
</html>
